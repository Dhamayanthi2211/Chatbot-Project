<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Motivational Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (inputText.trim() === "") return;

          const userMessage = {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID(),
          };

          setInputText("");
          const newChatMessages = [...chatMessages, userMessage];

          setChatMessages([
            ...newChatMessages,
            { message: "Thinking...", sender: "robot", id: crypto.randomUUID() },
          ]);

          let response = await Chatbot.getResponseAsync(inputText);

       
          if (inputText.toLowerCase().includes("motivational quote")) {
            const quotes = [
              "💪 Believe in yourself — you’re stronger than you think!",
              "🌟 Push yourself, because no one else will do it for you.",
              "🔥 Success doesn’t come from comfort zones.",
              "🌈 Every day is a new chance to grow and shine.",
              "✨ Don’t stop until you’re proud of yourself.",
            ];
            response =
              quotes[Math.floor(Math.random() * quotes.length)];
          }

          setChatMessages([
            ...newChatMessages,
            { message: response, sender: "robot", id: crypto.randomUUID() },
          ]);
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Type your message..."
              onChange={saveInputText}
              value={inputText}
              className="chat-input"
              onKeyDown={(e) => {
                if (e.key === "Enter") sendMessage();
              }}
            />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-robot"
            }
          >
            {sender === "robot" && (
              <img src="robot.png" alt="bot" className="chat-message-profile" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img src="user.png" alt="user" className="chat-message-profile" />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => (
              <ChatMessage
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
            ))}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);
        return (
          <div className="app-container">
            {chatMessages.length === 0 && (
              <p className="welcome-message">
                👋 Hi! I’m your Smart Motivational Chatbot.  
                Ask me anything — and if you ever feel low, just type  
                <strong>“give me a motivational quote”</strong> ✨
              </p>
            )}
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
